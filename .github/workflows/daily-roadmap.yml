name: 📋 Daily M365 Roadmap

on:
  schedule:
    # Once daily at 5:00 UTC (6 PM NZT) — roadmap changes daily, not hourly
    - cron: '0 5 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  id-token: write  # For Azure OIDC login

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: 📡 Fetch roadmap data
        run: python scripts/fetch_roadmap.py

      - name: 🔐 Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🤖 Summarise with AI (Azure OpenAI)
        run: |
          export AZURE_OPENAI_TOKEN=$(az account get-access-token --resource https://cognitiveservices.azure.com --query accessToken -o tsv)
          export AZURE_OPENAI_ENDPOINT="https://ainews-openai.openai.azure.com/"
          python scripts/summarise.py

      - name: 📊 Generate data files
        run: python scripts/generate_data.py

      - name: 💾 Commit generated files
        run: |
          git config user.name "M365 Roadmap Bot"
          git config user.email "roadmap-bot@aguidetocloud.com"
          git add site/
          git diff --cached --quiet || git commit -m "📋 Roadmap update — $(date -u +%Y-%m-%d)" --author="M365 Roadmap Bot <roadmap-bot@aguidetocloud.com>"
          git pull --rebase --strategy-option=theirs || (git rebase --abort && git pull --no-rebase -X theirs)
          git push || true

      - name: 🔄 Update main website with latest data
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/susanthgit/aguidetocloud-revamp.git /tmp/main-site
          mkdir -p /tmp/main-site/static/data/roadmap
          cp site/latest.json /tmp/main-site/static/data/roadmap/latest.json
          [ -f site/weekly.json ] && cp site/weekly.json /tmp/main-site/static/data/roadmap/weekly.json
          [ -f site/monthly.json ] && cp site/monthly.json /tmp/main-site/static/data/roadmap/monthly.json
          cd /tmp/main-site
          git config user.name "M365 Roadmap Bot"
          git config user.email "roadmap-bot@aguidetocloud.com"
          git add static/data/roadmap/
          git diff --cached --quiet || git commit -m "📋 Roadmap data update — $(date -u +%Y-%m-%d)"
          git push

      - name: 🚀 Deploy main website
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.159.1/hugo_extended_0.159.1_linux-amd64.tar.gz -O /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          cd /tmp/main-site
          /tmp/hugo --minify
          npm install -g @azure/static-web-apps-cli --quiet 2>/dev/null
          swa deploy /tmp/main-site/public --deployment-token ${{ secrets.MAIN_SITE_SWA_TOKEN }} --env production

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: fetch-and-deploy
    if: failure()
    steps:
      - name: 🚨 Create failure issue
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          gh issue create \
            --repo susanthgit/m365-roadmap \
            --title "🚨 Roadmap pipeline failed — $(date -u +%Y-%m-%d)" \
            --body "The daily M365 Roadmap workflow failed. Check the [workflow run](https://github.com/susanthgit/m365-roadmap/actions) for details." \
            --label "bug"
